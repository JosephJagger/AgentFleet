services:
  control-plane:
    container_name: agentfleet-control-plane
    image: agentfleet:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTFLEET_BUILD_SHA: ${AGENTFLEET_BUILD_SHA:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/control-plane.sqlite
      WEB_DIST_DIR: /app/web
      AGENTFLEET_RELEASE_MANIFEST_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}/downloads/manifest.json
      RUNTIME_RELEASE_DIR: /app/runtime-releases
      AUTH_MODE: email
      DJANGO_AUTH_URL: http://identity:8000
      # Only Django needs the email-provider key and signing secret.
      RESEND_API_KEY: ""
      DJANGO_SECRET_KEY: ""
    depends_on:
      runtime-validator:
        condition: service_started
      identity:
        condition: service_healthy
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:3215:3000"
    volumes:
      - agentfleet-data:/app/data
      - agentfleet-runtime-releases:/app/runtime-releases
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_AUTH_SERVICE_TOKEN: ${DJANGO_AUTH_SERVICE_TOKEN:?Set DJANGO_AUTH_SERVICE_TOKEN in .env}
      DJANGO_DATABASE_PATH: /data/identity.sqlite
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-AgentFleets}
    volumes:
      - agentfleet-identity:/data
    # Internal service only: no published host port.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s

  runtime-validator:
    container_name: agentfleet-runtime-validator
    image: agentfleet:local
    command: ["node", "control-plane/dist/src/runtime-worker.js"]
    restart: unless-stopped
    environment:
      RUNTIME_RELEASE_DIR: /app/runtime-releases
      RUNTIME_BASELINE_DIR: /app/web/downloads
    volumes:
      - agentfleet-runtime-releases:/app/runtime-releases
    # No database, credentials, Docker socket, host projects or inbound ports.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1536m
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('/app/runtime-releases/state.json');process.exit(Date.now()-Date.parse(s.workerHeartbeatAt)<90000?0:1)"]
      interval: 30s
      timeout: 4s
      start_period: 60s

volumes:
  agentfleet-identity:
    name: agentfleet-identity
  agentfleet-data:
    name: agentfleet-data
  agentfleet-runtime-releases:
    name: agentfleet-runtime-releases
